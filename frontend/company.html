<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Profile — Fieldnote</title>
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
<div class="container">
  <header class="site-header">
    <div class="header-inner" style="padding: 0;">
      <a href="index.html" class="masthead-logo">
        <span class="masthead-title">Fieldnote</span>
        <span>Career Edition // 2026</span>
      </a>
      <nav class="main-nav">
        <a href="index.html#jobs">Jobs</a>
        <a href="companies.html">Companies</a>
        <a href="about.html">About</a>
        <a href="dashboard.html" class="nav-active">Dashboard</a>
        <div id="nav-notifications" class="nav-notifications" style="display: none; position: relative; cursor: pointer; border-right: var(--border-thin); padding: 0 24px; align-items: center;">
          🔔 <span id="notif-badge" style="background: var(--danger); color: white; border-radius: 0; padding: 2px 6px; font-size: 10px; position: absolute; top: 15px; right: 10px; display: none;">0</span>
          <div id="notif-dropdown" style="display: none; position: absolute; right: 0; top: 100%; width: 250px; background: var(--bg-surface); border: var(--border-thick); box-shadow: 4px 4px 0 var(--ink-main); max-height: 300px; overflow-y: auto; z-index: 1000; padding: 10px;">
            <p style="font-size: 12px; margin: 0; color: var(--ink-light); font-family: var(--font-mono);">No new notifications</p>
          </div>
        </div>
      </nav>
      <span id="nav-auth-slot" class="nav-auth"></span>
    </div>
  </header>

  <main class="container-body" style="padding: 0; background: var(--bg-base);">
    
    <p id="access-denied" class="empty-state" hidden style="margin: 32px;">
      This page is for recruiters. <a href="index.html">Back to job listings</a>
    </p>

    <div id="company-content" class="dashboard-overview" hidden>
      
      <div class="dashboard-welcome">
        <div>
          <h1>Company Profile</h1>
          <p>Update your company details for candidates to see.</p>
        </div>
        <a href="dashboard.html" class="ghost-btn" style="text-decoration: none; padding: 12px 24px; font-size: 1rem; display: inline-flex; align-items: center;">Back to Dashboard</a>
      </div>

      <div class="dashboard-card" style="max-width: 600px; margin: 0 auto; margin-top: 32px;">
        <form id="company-form" class="auth-form">
          <div class="form-group">
            <label for="company-name">Company Name</label>
            <input type="text" id="company-name" placeholder="e.g. Acme Corp" required />
          </div>
          
          <div class="form-group">
            <label for="company-website">Website URL</label>
            <input type="url" id="company-website" placeholder="https://www.example.com" />
          </div>

          <div class="form-group">
            <label for="company-desc">Company Description</label>
            <textarea id="company-desc" rows="5" placeholder="Describe your company culture, mission, and benefits..."></textarea>
          </div>

          <p id="company-msg" style="color: var(--accent-primary); font-family: var(--font-mono); font-size: 14px; min-height: 20px;"></p>
          
          <button type="submit" style="width: 100%; margin-top: 16px;">Save Company Profile</button>
        </form>
      </div>

    </div>
  </main>
</div>

  <script src="auth.js"></script>
  <script src="company.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
