<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Fieldnote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Field<span>note</span></a>
      <nav class="main-nav">
        <a href="index.html#jobs">Jobs</a>
        <span id="nav-auth-slot" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <div class="auth-card">
      <p class="eyebrow">Milestone 04 — Authentication</p>
      <h1 class="auth-title">Log in</h1>
      <p class="auth-sub">
        Demo accounts, seeded by <code>database/seed.py</code>:<br />
        <code>recruiter@example.com</code> / <code>password123</code><br />
        <code>candidate@example.com</code> / <code>password123</code>
      </p>

      <form id="login-form" class="auth-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit">Log in</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>AI Job Portal — learning project.</p>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="auth-forms.js"></script>
</body>
</html>
