<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Fieldnote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">Field<span>note</span></a>
      <nav class="main-nav">
        <a href="/#jobs">Jobs</a>
        <a href="/companies">Companies</a>
        <a href="/pricing">Pricing</a>
        <a href="/about">About</a>
      </nav>
      <span id="nav-auth-slot" class="nav-auth"></span>
    </div>
  </header>

  <main class="container-body auth-page">
    <div class="auth-card">
      <p class="eyebrow">Milestone 04 — Authentication</p>
      <h1 class="auth-title">Log in</h1>
      <p class="auth-sub">
        Demo accounts, seeded by <code style="font-family: var(--font-mono); background: var(--bg-base); padding: 2px 4px; border: var(--border-thin);">database/seed.py</code>:<br />
        <code>recruiter@example.com</code> / <code>password123</code><br />
        <code>candidate@example.com</code> / <code>password123</code>
      </p>

      <form id="login-form" class="auth-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit">Log in</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-text">
      Fieldnote &copy; 2026.
    </div>
    <div class="footer-links">
      <a href="/about">About Us</a>
      <a href="/companies">Top Companies</a>
      <a href="/pricing">For Employers</a>
      <a href="/contact">Contact</a>
    </div>
  </footer>
</div>

  <script src="auth.js"></script>
  <script src="auth-forms.js"></script>
</body>
</html>
