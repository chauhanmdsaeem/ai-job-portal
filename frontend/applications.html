<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — Fieldnote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <header class="site-header">
    <div class="header-inner" style="padding: 0;">
      <a href="index.html" class="masthead-logo">
        <span class="masthead-title">Fieldnote</span>
        <span>Career Edition // 2026</span>
      </a>
      <nav class="main-nav">
        <a href="index.html#jobs">Jobs</a>
        <a href="companies.html">Companies</a>
        <a href="pricing.html">Pricing</a>
        <a href="about.html">About</a>
        <div id="nav-notifications" class="nav-notifications" style="display: none; position: relative; cursor: pointer; border-right: var(--border-thin); padding: 0 24px; align-items: center;">
          🔔 <span id="notif-badge" style="background: var(--danger); color: white; border-radius: 0; padding: 2px 6px; font-size: 10px; position: absolute; top: 15px; right: 10px; display: none;">0</span>
          <div id="notif-dropdown" style="display: none; position: absolute; right: 0; top: 100%; width: 250px; background: var(--bg-surface); border: var(--border-thick); box-shadow: 4px 4px 0 var(--ink-main); max-height: 300px; overflow-y: auto; z-index: 1000; padding: 10px;">
            <p style="font-size: 12px; margin: 0; color: var(--ink-light); font-family: var(--font-mono);">No new notifications</p>
          </div>
        </div>
      </nav>
      <span id="nav-auth-slot" class="nav-auth"></span>
    </div>
  </header>

  <main class="container" style="padding: 48px 24px 80px;">
    <p class="eyebrow">Milestone 05 — Job Management</p>
    <div class="listings-head">
      <h2>My applications</h2>
      <p id="results-count" class="results-count"></p>
    </div>

    <div id="applications-list" class="applications-list"></div>

    <p id="empty-state" class="empty-state" hidden>
      You haven't applied to anything yet. <a href="index.html#jobs">Browse open roles →</a>
    </p>

    <p id="access-denied" class="empty-state" hidden>
      This page is for candidates. <a href="index.html">Back to job listings</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>AI Job Portal — learning project.</p>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="applications.js"></script>
</body>
</html>
