<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — Fieldnote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Field<span>note</span></a>
      <nav class="main-nav">
        <a href="index.html#jobs">Jobs</a>
        <span id="nav-auth-slot" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 48px 24px 80px;">
    <p class="eyebrow">Milestone 05 — Job Management</p>
    <div class="listings-head">
      <h2>My applications</h2>
      <p id="results-count" class="results-count"></p>
    </div>

    <div id="applications-list" class="applications-list"></div>

    <p id="empty-state" class="empty-state" hidden>
      You haven't applied to anything yet. <a href="index.html#jobs">Browse open roles →</a>
    </p>

    <p id="access-denied" class="empty-state" hidden>
      This page is for candidates. <a href="index.html">Back to job listings</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>AI Job Portal — learning project.</p>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="applications.js"></script>
</body>
</html>
